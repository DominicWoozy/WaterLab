name: Deploy WaterLab to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check types and GPU command scheduling
        run: |
          npx tsc --noEmit
          npm run test:gpu
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Verify static output
        run: node scripts/check-pages.mjs
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
